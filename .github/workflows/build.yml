name: APK Derle
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Projeyi bul (zip varsa ac)
        run: |
          if [ -f BDMuzik.zip ]; then mkdir -p src_proj && unzip -q BDMuzik.zip -d src_proj; fi
          D=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)")
          echo "PROJ=$D" >> "$GITHUB_ENV"
      - name: Derle
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BD-Muzik-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
